<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="description" content="ShopMate modern responsive e-commerce store with bKash, Nagad, Card and COD">
<title>ShopMate — E-commerce Store</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#fff;--text:#142033;--muted:#667085;--line:#e8ebf2;--soft:#f5f6fb;--primary:#5d46f6;--primary2:#6d52ff;--dark:#111c2d;--shadow:0 8px 30px rgba(22,30,55,.08);--radius:10px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:var(--text);background:var(--bg);padding-bottom:60px}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-size:16px} /* Prevents iOS auto-zoom */
img{max-width:100%;height:auto;display:block}
.app{min-height:100vh}

/* Announcements */
.announcement{background:#111c2d;color:#fff;padding:8px 12px;text-align:center;font-size:11px;line-height:1.4}

/* Header */
.header{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4%;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(16px);z-index:40}
.brand{font-size:20px;font-weight:800;display:flex;align-items:center;gap:7px}
.brandIcon{background:var(--primary);color:#fff;border-radius:8px;padding:5px 8px;font-size:16px}
nav.desktopNav{display:flex;gap:18px;align-items:center}
nav.desktopNav button{font-size:13px;padding:24px 0;border-bottom:2px solid transparent;font-weight:500}
nav.desktopNav button.active,nav.desktopNav button:hover{color:var(--primary);border-bottom-color:var(--primary)}

.headActions{display:flex;align-items:center;gap:10px}
.searchBox{width:220px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--soft);display:flex;align-items:center;padding:0 10px}
.searchBox input{border:0;outline:0;background:transparent;width:100%;font-size:13px}
.iconBtn{position:relative;font-size:20px;padding:6px;display:flex;align-items:center;justify-content:center}
.iconBtn i{position:absolute;right:0;top:0;background:var(--primary);color:#fff;border-radius:50%;font-size:9px;font-style:normal;min-width:16px;height:16px;display:grid;place-items:center;font-weight:700}
.loginBtn{font-size:12px;font-weight:600;white-space:nowrap;padding:7px 12px;border-radius:6px;background:var(--soft)}
.themeBtn{font-size:18px;padding:6px}
.menuBtn{display:none;font-size:22px;padding:6px}

/* Mobile Slide-out Menu */
.mobileMenuOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;display:none}
.mobileMenuOverlay.open{display:block}
.mobileDrawer{position:fixed;top:0;left:0;bottom:0;width:min(320px,85%);background:var(--bg);z-index:100;box-shadow:0 0 40px rgba(0,0,0,.2);display:flex;flex-direction:column;padding:20px;transform:translateX(-100%);transition:transform .25s ease}
.mobileMenuOverlay.open .mobileDrawer{transform:translateX(0)}
.mobileDrawerHead{display:flex;justify-content:space-between;align-items:center;padding-bottom:15px;border-bottom:1px solid var(--line)}
.mobileDrawerNav{display:flex;flex-direction:column;gap:5px;margin-top:15px;flex:1;overflow-y:auto}
.mobileDrawerNav button{text-align:left;padding:12px;border-radius:8px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px}
.mobileDrawerNav button.active{background:var(--soft);color:var(--primary)}

/* Mobile Bottom Navigation Bar */
.bottomNav{position:fixed;bottom:0;left:0;right:0;height:56px;background:var(--bg);border-top:1px solid var(--line);display:none;grid-template-columns:repeat(5,1fr);z-index:50}
.bottomNav button{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--muted);position:relative}
.bottomNav button span.bIcon{font-size:18px;margin-bottom:2px}
.bottomNav button.active{color:var(--primary)}
.bottomNav button i{position:absolute;top:4px;right:calc(50% - 14px);background:var(--primary);color:#fff;border-radius:50%;font-size:9px;font-style:normal;min-width:14px;height:14px;display:grid;place-items:center;font-weight:700}

/* Hero Section */
.hero{margin:18px 4%;border-radius:14px;background:linear-gradient(120deg,#f4f2ff,#f2f0ff 55%,#eef3ff);min-height:300px;display:grid;grid-template-columns:1.2fr 1fr;overflow:hidden}
.heroCopy{padding:35px 5%;display:flex;flex-direction:column;justify-content:center}
.heroCopy small{color:var(--primary);font-weight:700;letter-spacing:.5px;font-size:11px}
.heroCopy h1{font-size:clamp(24px,3.5vw,36px);line-height:1.2;margin:10px 0}
.heroCopy em{font-style:normal;color:var(--primary)}
.heroCopy p{max-width:480px;color:#566176;font-size:clamp(12px,1.5vw,14px);line-height:1.6;margin:0 0 18px}
.primary{background:linear-gradient(135deg,var(--primary),#7c5cff);color:#fff;padding:12px 22px;border-radius:8px;font-weight:700;box-shadow:0 6px 18px rgba(93,70,246,.25);display:inline-block;text-align:center}
.secondary{background:var(--soft);padding:11px 18px;border-radius:8px;font-weight:600;text-align:center}
.heroVisual{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.heroVisual img{width:88%;height:88%;object-fit:cover;border-radius:14px;mix-blend-mode:multiply;opacity:.9}
.blob{position:absolute;width:280px;height:200px;background:#d8ceff;border-radius:45% 55% 60% 40%;filter:blur(2px)}
.scribble{position:absolute;right:8%;top:20px;color:#6545e8;font-weight:700;font-style:italic;transform:rotate(-8deg);font-size:14px}
.benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px;padding-top:16px;border-top:1px solid rgba(0,0,0,.06)}
.benefits span{font-size:12px;display:flex;align-items:center;gap:6px}
.benefits b{font-size:10px;display:block}
.benefits small{color:#778094;font-size:8px;display:block}

/* Section Header */
.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:24px 4% 14px}
.sectionTitle h2{font-size:clamp(16px,2.2vw,20px);margin:0 0 3px}
.sectionTitle p{font-size:11px;color:var(--muted);margin:0}
.sectionTitle button{color:var(--primary);font-size:12px;font-weight:700}

/* Categories Grid */
.catGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:0 4% 25px}
.catCard{background:var(--soft);border-radius:10px;padding:12px 8px;min-height:105px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;transition:transform .2s}
.catCard:hover{transform:translateY(-3px);border-color:#dcd7ff}
.catCard img{width:56px;height:52px;object-fit:cover;border-radius:8px}
.catCard b,.catCard h3{font-size:11px;margin:0;text-align:center}

/* Products Grid */
.productGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:0 4% 28px}
.productCard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.productCard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.productImg{height:180px;background:#f7f8fb;position:relative;overflow:hidden}
.productImg img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.sale{position:absolute;z-index:2;left:7px;top:7px;background:#ff4455;color:#fff;border-radius:8px;padding:3px 6px;font-size:9px;font-weight:800}
.wish{position:absolute;z-index:2;right:7px;top:7px;background:#fff;border:1px solid var(--line);width:28px;height:28px;border-radius:50%;font-size:15px;display:grid;place-items:center}
.productInfo{padding:10px;display:flex;flex-direction:column;flex-grow:1}
.productInfo h3{font-size:12px;font-weight:700;margin:0 0 5px;cursor:pointer;line-height:1.3}
.stars{color:#ffad0a;font-size:11px;letter-spacing:1px}
.stars small{color:#7c8798;letter-spacing:0;font-size:9px}
.price{color:#e73545;font-weight:800;font-size:14px;margin:6px 0}
.price del{color:#98a0ad;font-size:10px;font-weight:500;margin-left:5px}
.add{width:100%;margin-top:auto;background:#142033;color:#fff;border-radius:6px;padding:9px;font-size:11px;font-weight:600}
.add:active{background:var(--primary)}

/* Promo & Reviews */
.promoGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin:0 4% 28px}
.promo{min-height:145px;border-radius:10px;padding:22px;display:flex;justify-content:space-between;align-items:center;overflow:hidden}
.promo h2{font-size:12px;margin:0}
.promo h3{font-size:20px;margin:4px 0}
.promo p{margin:0 0 10px;font-size:11px}
.darkPromo{background:linear-gradient(120deg,#101621,#1d2534);color:#fff}
.greenPromo{background:linear-gradient(120deg,#dff2d8,#f1f9e9);color:#21452a}
.greenPromo button{background:#fff;padding:8px 16px;border-radius:20px;font-size:11px}
.discountBubble{width:54px;height:54px;border-radius:50%;background:#6d52ff;display:grid;place-items:center;text-align:center;font-weight:800;font-size:10px;color:#fff}

.reviews{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:0 4% 28px}
.review{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:#eee8ff;color:var(--primary);display:grid;place-items:center;font-weight:800;flex-shrink:0}
.review b{font-size:11px;display:block}
.review small{font-size:8px;color:#6c7889;display:block;margin-top:2px}
.review p{font-size:10px;color:#5d6675;line-height:1.5;margin:6px 0 0}

/* Newsletter */
.newsletter{margin:0 4% 20px;background:#f0f2ff;border-radius:10px;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.newsletter>div{display:flex;gap:12px;align-items:center}
.newsletter span{font-size:26px;color:var(--primary)}
.newsletter h3{margin:0;font-size:13px}
.newsletter p{font-size:10px;color:#69748a;margin:3px 0 0}
.newsletter form{display:flex;flex:1;min-width:240px}
.newsletter input{flex:1;border:1px solid var(--line);padding:9px 12px;border-radius:6px 0 0 6px;font-size:12px}
.newsletter button{background:var(--primary);color:#fff;padding:0 18px;border-radius:0 6px 6px 0;font-size:12px;font-weight:600}

/* Footer */
.footer{background:#111c2d;color:#dfe5ee;padding:32px 4% 20px}
.footerGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px}
.footer h3,.footer h4{margin:0 0 10px;color:#fff}
.footer p,.footer button{display:block;color:#aeb8c8;font-size:10px;line-height:1.8;text-align:left}
.payments{background:#fff;color:#152033;padding:6px 10px;border-radius:6px;font-size:10px;display:inline-block;font-weight:700}
.copyright{border-top:1px solid #2d3747;margin-top:20px;padding-top:12px;font-size:10px;color:#8f9aac;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* Container & Pages */
.container{padding:24px 4%;min-height:65vh}
.pageHead{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.pageHead h1{font-size:clamp(22px,3vw,28px);margin:4px 0}
.pageHead p{color:var(--muted);font-size:12px;margin:0}

/* Shop Layout with Mobile Toggle */
.shopLayout{display:grid;grid-template-columns:230px 1fr;gap:20px}
.filters{border:1px solid var(--line);border-radius:10px;padding:16px;height:max-content;position:sticky;top:85px;background:var(--bg)}
.filters h3{margin-top:0;font-size:15px}
.filters label{display:block;font-size:11px;font-weight:700;margin:14px 0}
.filters select,.filters input[type=range]{display:block;width:100%;margin-top:6px}
.filters select,.shopToolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.reset{background:var(--soft);padding:10px;width:100%;border-radius:7px;font-weight:600;margin-top:10px}
.filterToggleBtn{display:none;width:100%;background:var(--soft);border:1px solid var(--line);padding:10px;border-radius:8px;font-size:13px;font-weight:700;margin-bottom:12px}

.shopToolbar{display:flex;justify-content:space-between;margin-bottom:15px;gap:10px;flex-wrap:wrap}
.shopToolbar input{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;font-size:13px}
.shopToolbar select{width:160px}
.empty{min-height:200px;display:grid;place-items:center;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:25px}

/* Product Detail */
.productDetail{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;margin-bottom:35px}
.detailImage{height:clamp(280px,45vw,480px);background:var(--soft);border-radius:12px;overflow:hidden;display:grid;place-items:center}
.detailImage img{width:100%;height:100%;object-fit:cover}
.detailCopy h1{font-size:clamp(22px,3vw,30px);margin:6px 0}
.bigPrice{font-size:22px;color:#e73545;font-weight:800;margin:10px 0}
.bigPrice del{font-size:13px;color:#98a0ad;font-weight:500;margin-left:6px}
.bigPrice mark{font-size:10px;background:#ffe8eb;color:#e73545;padding:4px 6px;border-radius:4px;vertical-align:2px}
.option{font-size:11px;font-weight:700;display:block;margin:14px 0}
.option button{padding:7px 12px;border:1px solid var(--line);border-radius:6px;margin:6px 6px 0 0;font-size:11px}
.option button.selected{border-color:var(--primary);background:#f0edff;color:var(--primary)}
.buyRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;height:40px}
.qty button{width:34px;height:100%;font-size:16px}
.qty b{min-width:28px;text-align:center;font-size:13px}
.trust{margin-top:16px;padding:12px;background:var(--soft);border-radius:8px;font-size:10px;color:#657084;line-height:1.6}

/* Cart & Checkout */
.cartLayout,.checkout{display:grid;grid-template-columns:1fr 330px;gap:20px}
.cartItem{display:grid;grid-template-columns:70px 1fr auto auto auto;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cartItem img{width:70px;height:70px;object-fit:cover;border-radius:8px}
.cartItem h3{font-size:12px;margin:0 0 4px}
.summary{border:1px solid var(--line);border-radius:10px;padding:18px;height:max-content;position:sticky;top:85px;background:var(--bg)}
.summary h2{font-size:16px;margin:0 0 12px}
.summary>div{display:flex;justify-content:space-between;margin:10px 0;font-size:11px}
.summary hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.summary .grand{font-size:16px;font-weight:800;color:#e73545}
.coupon{display:flex!important;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin:12px 0}
.coupon input{flex:1;border:0;padding:8px 10px;outline:0;font-size:12px}
.coupon button{background:var(--primary);color:#fff;padding:0 12px;font-size:11px;font-weight:700}
.full{width:100%;display:block;margin-top:12px}

.formCard{border:1px solid var(--line);border-radius:10px;padding:18px;background:var(--bg);margin-bottom:15px}
.formCard h2{font-size:15px;margin:0 0 14px}
.formGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.formGrid label{font-size:10px;font-weight:700;display:block}
.formGrid input,.formCard input{display:block;width:100%;margin-top:5px;border:1px solid var(--line);padding:9px 11px;border-radius:7px;background:var(--bg);font-size:13px}

/* Payment choices */
.paymentChoices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.pay{border:1px solid var(--line);padding:10px 8px;border-radius:8px;font-size:11px;display:flex;align-items:center;gap:6px;cursor:pointer}
.pay.selected{border-color:var(--primary);background:#f2efff}
.pay-instruction{padding:12px;border-radius:8px;margin:10px 0;font-size:11px;line-height:1.6}
.bkash-box{background:#fdf2f8;border:1px solid #fbcfe8;color:#9d174d}
.nagad-box{background:#fff7ed;border:1px solid #fed7aa;color:#c2410c}
.ssl-box{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}

/* Toast */
.toast{position:fixed;right:18px;bottom:70px;background:#111c2d;color:#fff;padding:11px 16px;border-radius:8px;box-shadow:var(--shadow);z-index:90;font-size:12px}

/* Dark Mode */
.dark{--bg:#0c1320;--text:#edf2fa;--muted:#98a4b6;--line:#253145;--soft:#151f30;--shadow:0 8px 30px rgba(0,0,0,.35)}
.dark .hero{background:linear-gradient(120deg,#17152d,#1a1d38)}
.dark .productImg{background:#111a29}
.dark .wish{background:#172033}
.dark .darkPromo{background:#080d16}
.dark .greenPromo{background:#18271d}
.dark .newsletter{background:#151b31}
.dark .announcement{background:#070c14}
.dark .bottomNav,.dark .mobileDrawer{background:#0c1320}

/* Social Media & Contact Layout */
.socialLinks{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.socialBtn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;transition:transform .2s,opacity .2s;color:#fff!important;cursor:pointer}
.socialBtn:hover{transform:translateY(-2px);opacity:.92}
.social-fb{background:#1877f2}
.social-wa{background:#25d366}
.social-ig{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.social-yt{background:#ff0000}
.social-x{background:#111}
.social-in{background:#0a66c2}
.contactGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:16px}
.contactCard{border:1px solid var(--line);border-radius:12px;padding:22px;background:var(--bg)}
.contactItem{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.contactIcon{width:40px;height:40px;border-radius:10px;background:var(--soft);color:var(--primary);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.contactItem b{display:block;font-size:13px;margin-bottom:2px}
.contactItem span{display:block;font-size:12px;color:var(--muted)}
.footerSocials{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.footerSocialBtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff!important;font-size:13px;text-decoration:none;transition:transform .2s}
.footerSocialBtn:hover{transform:scale(1.1)}

/* ==========================================
   SSLCOMMERZ EASY CHECKOUT MODAL (As per screenshot)
   ========================================== */
.sslModalBackdrop{position:fixed;inset:0;background:rgba(15,23,42,0.72);backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:12px;overflow-y:auto}
.sslModalBox{background:#fff;border-radius:12px;max-width:870px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,0.35);display:grid;grid-template-columns:340px 1fr;overflow:hidden;position:relative;color:#1e293b;animation:sslPop .2s ease-out}
@keyframes sslPop{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}
.sslLeftCol{background:#fff;border-right:1px solid #eef2f6;padding:24px 22px;display:flex;flex-direction:column;justify-content:space-between}
.sslRightCol{background:#fff;padding:24px 26px;display:flex;flex-direction:column}
.sslHeader{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.sslBrand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.sslBrandBadge{background:#ea580c;color:#fff;border-radius:4px;padding:3px 6px;font-size:10px;font-weight:800}
.sslTimer{font-size:13px;font-weight:700;color:#64748b;display:flex;align-items:center;gap:4px}
.sslAmountCard{background:#f0f7ff;border:1px solid #dbeafe;border-radius:10px;padding:16px 18px;margin-bottom:18px}
.sslAmountCard small{color:#64748b;font-size:11px;font-weight:600;display:block}
.sslAmountCard h2{font-size:26px;font-weight:800;color:#0f172a;margin:4px 0 0}
.sslSummaryRow{display:flex;justify-content:space-between;font-size:12px;padding:8px 0;border-bottom:1px dashed #e2e8f0;color:#475569}
.sslSummaryRow.total{font-weight:700;border-bottom:0;color:#0f172a;font-size:13px;padding-top:10px}
.sslOffersBox{margin-top:20px;padding:14px;border-radius:8px;border:1px solid #f1f5f9;background:#fafafa;text-align:center;font-size:11px;color:#94a3b8}
.sslFooterLinks{font-size:10px;color:#94a3b8;display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding-top:14px;border-top:1px solid #f1f5f9}
.sslTopBar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sslGPayBar{background:#000;color:#fff;border-radius:8px;padding:10px 14px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:13px;cursor:pointer;margin-bottom:14px}
.sslDivider{display:flex;align-items:center;gap:12px;margin:10px 0 14px;color:#94a3b8;font-size:11px}
.sslDivider::before,.sslDivider::after{content:"";flex:1;height:1px;background:#e2e8f0}
.sslTabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.sslTabBtn{border:1px solid #e2e8f0;background:#fff;border-radius:8px;padding:10px 6px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:#475569;transition:.15s}
.sslTabBtn.active{background:#0072f5;color:#fff;border-color:#0072f5}
.sslTabBtn span.tabIcon{font-size:16px}
.sslMfsGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-height:230px;overflow-y:auto;padding:4px}
.sslMfsItem{border:1px solid #e2e8f0;border-radius:8px;padding:10px 6px;text-align:center;cursor:pointer;background:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:700;transition:.15s}
.sslMfsItem:hover,.sslMfsItem.selected{border-color:#0072f5;background:#f0f7ff}

.sslPayBtn:hover{background:#005ecc}

  useEffect(()=>localStorage.setItem("shopmate-wishlist",JSON.stringify(wishlist)),[wishlist]);
  useEffect(()=>{document.documentElement.classList.toggle("dark",dark);localStorage.setItem("shopmate-dark",dark?"1":"0")},[dark]);
  useEffect(()=>localStorage.setItem("shopmate-user",JSON.stringify(user)),[user]);
  useEffect(()=>localStorage.setItem("shopmate-orders",JSON.stringify(orders)),[orders]);

  const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
  const discount=couponApplied?Math.min(total*.1,100):0;
  const shipping=total>=50||total===0?0:6.99;
  const grand=Math.max(0,total-discount+shipping);

function Checkout({cart,total,discount,shipping,grand,user,setOrders,setCart,nav,notify}){
  const [form,setForm]=useState({name:user?.name||"",email:user?.email||"",phone:"",address:"",city:"Dhaka",country:"Bangladesh",postal:""});
  const [payment,setPayment]=useState("ssl"); // Default to Card / SSLCommerz
  const [trxId,setTrxId]=useState("");
  const [senderNum,setSenderNum]=useState("");
  const [showSSLModal,setShowSSLModal]=useState(false);
  const bdtTotal=Math.round(grand*120);

  const placeOrder=(paymentDetails)=>{
    const isCod = payment==="cod";
    const order={
      id:"SM-"+Date.now().toString().slice(-6),
      date:new Date().toLocaleDateString(),
      total:grand,
      status:isCod ? "Pending (Cash on Delivery)" : (paymentDetails?"Paid (SSLCOMMERZ)":"Paid (Verification)"),
      paymentMethod:isCod ? "Cash on Delivery" : (paymentDetails?.method || (payment==="ssl"?"Card / SSLCOMMERZ":"bKash")),
      trxId:paymentDetails?.trxId || trxId || (isCod?"COD-"+Date.now().toString().slice(-6):"N/A"),
      senderNum:senderNum||"N/A",
      items:cart.map(x=>({name:x.name,qty:x.qty,img:x.img}))
    };
    setOrders(o=>[order,...o]);
    setCart([]);
    setShowSSLModal(false);
    notify(isCod ? "অর্ডার সফলভাবে গ্রহণ করা হয়েছে (Cash on Delivery)!" : "পেমেন্ট সফলভাবে গ্রহণ করা হয়েছে!");
    nav("profile");
  };

  const submit=e=>{
    e.preventDefault();
    if(!cart.length) return;
    if(payment==="ssl"){
      setShowSSLModal(true);
      return;
    }
    if(payment==="bkash"&&(!trxId||!senderNum)){alert("দয়া করে আপনার বিকাশ নম্বর এবং TrxID দিন");return;}
    if(payment==="nagad"&&(!trxId||!senderNum)){alert("দয়া করে আপনার নগদ নম্বর এবং TrxID দিন");return;}
    placeOrder();
  };

  return <main className="container">
    <div className="pageHead"><div><small style={{color:"var(--primary)",fontWeight:700}}>CHECKOUT</small><h1>Secure Checkout</h1></div></div>
    
    {showSSLModal && (
      <SSLCommerzModal
        amount={grand}
        bdtTotal={bdtTotal}
        onSuccess={(details)=>placeOrder(details)}
        onClose={()=>setShowSSLModal(false)}
      />
    )}

    <form className="checkout" onSubmit={submit}>
      <section className="formCard">
        <h2>Customer Information</h2>
        <div className="formGrid">
          <label>Full Name<input required value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Your full name"/></label>
          <label>Phone Number<input required value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="017XXXXXXXX"/></label>
          <label>Email Address<input required type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="you@example.com"/></label>
          <label>Delivery Address<input required value={form.address} onChange={e=>setForm({...form,address:e.target.value})} placeholder="Street address"/></label>
          <label>City<input required value={form.city} onChange={e=>setForm({...form,city:e.target.value})}/></label>
          <label>Postal Code<input required value={form.postal} onChange={e=>setForm({...form,postal:e.target.value})} placeholder="1205"/></label>
        </div>

        <h2 style={{marginTop:"20px"}}>Payment Method</h2>
        <div className="paymentChoices" style={{gridTemplateColumns:"repeat(auto-fit,minmax(210px,1fr))"}}>
          <label className={payment==="ssl"?"pay selected":"pay"} style={{padding:"12px 14px",display:"flex",alignItems:"center",gap:"10px"}}>
            <input type="radio" checked={payment==="ssl"} onChange={()=>setPayment("ssl")}/>
            <SslSvg size={28}/>
            <div>
              <b style={{color:"#0284c7",display:"block"}}>Card / SSLCOMMERZ</b>
              <small style={{color:"var(--muted)",fontSize:"10px"}}>Cards, bKash, Nagad, Net Banking</small>
            </div>
          </label>
          <label className={payment==="cod"?"pay selected":"pay"} style={{padding:"12px 14px",display:"flex",alignItems:"center",gap:"10px"}}>
            <input type="radio" checked={payment==="cod"} onChange={()=>setPayment("cod")}/>
            <CodSvg size={28}/>
            <div>
              <b style={{color:"#059669",display:"block"}}>Cash on Delivery</b>
              <small style={{color:"var(--muted)",fontSize:"10px"}}>Pay cash at your doorstep</small>
            </div>
          </label>
          <label className={payment==="bkash"?"pay selected":"pay"} style={{padding:"12px 14px",display:"flex",alignItems:"center",gap:"10px"}}>
            <input type="radio" checked={payment==="bkash"} onChange={()=>setPayment("bkash")}/>
            <BkashSvg size={28}/>
            <div>
              <b style={{color:"#e2136e",display:"block"}}>Direct bKash TrxID</b>
              <small style={{color:"var(--muted)",fontSize:"10px"}}>Manual Send Money</small>
            </div>
          </label>
        </div>

        {payment==="ssl"&&<div className="pay-instruction ssl-box" style={{marginTop:"14px",padding:"14px",borderRadius:"8px",background:"#eff6ff",border:"1px solid #bfdbfe",color:"#1e40af"}}>
          <b>💳 SSLCOMMERZ Easy Checkout Gateway:</b>
          <p style={{margin:"4px 0 0",fontSize:"12px"}}>
            অর্ডার কনফার্ম করার পর সরাসরি <b>SSLCOMMERZ পপআপ গেটওয়ে</b> ওপেন হবে। আপনি <b>Visa, Mastercard, bKash, Nagad, Rocket, CellFin</b> অথবা যেকোনো ব্যাংক কার্ড দিয়ে সিকিউর পেমেন্ট সম্পন্ন করতে পারবেন।
          </p>
        </div>}

        {payment==="cod"&&<div className="pay-instruction" style={{marginTop:"14px",padding:"14px",borderRadius:"8px",background:"#ecfdf5",border:"1px solid #a7f3d0",color:"#065f46",display:"flex",alignItems:"flex-start",gap:"12px"}}>
          <CodSvg size={36}/>
          <div>
            <b style={{display:"block",marginBottom:"3px"}}>Cash on Delivery (ক্যাশ অন ডেলিভারি):</b>
            <p style={{margin:0,fontSize:"12px",lineHeight:1.6}}>
              পণ্য হাতে পেয়ে ডেলিভারি পার্সন-কে মোট <b>৳{bdtTotal.toLocaleString()} BDT</b> ক্যাশ টাকা পরিশোধ করুন। কোনো অগ্রিম পেমেন্টের প্রয়োজন নেই।
            </p>
          </div>
        </div>}

        {payment==="bkash"&&<div className="pay-instruction bkash-box" style={{marginTop:"14px"}}>
          <b>bKash পেমেন্ট নির্দেশিকা:</b>
          <p>বিকাশ নম্বর: <b>01614703406</b> (Personal / Merchant)</p>
          <p>টাকার পরিমাণ: <b>৳{bdtTotal.toLocaleString()} BDT</b> ({money(grand)})</p>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:"10px",marginTop:"8px"}}>
            <input placeholder="আপনার বিকাশ নম্বর" value={senderNum} onChange={e=>setSenderNum(e.target.value)}/>
            <input placeholder="TrxID (Transaction ID)" value={trxId} onChange={e=>setTrxId(e.target.value)}/>
          </div>
        </div>}
      </section>

      <aside className="summary">
        <h2>Order Summary</h2>
        {cart.map(x=><div key={x.id}><span>{x.name} × {x.qty}</span><b>{money(x.price*x.qty)}</b></div>)}
        <hr/>
        <div><span>Subtotal</span><b>{money(total)}</b></div>
        <div><span>Shipping</span><b>{shipping?money(shipping):"FREE"}</b></div>

        <div style={{color:"var(--muted)",fontSize:"12px",textAlign:"right"}}>Approx: <b>৳{bdtTotal.toLocaleString()} BDT</b></div>
        <button className="primary full" type="submit">
          {payment==="ssl"?`Proceed to SSLCOMMERZ (৳${bdtTotal.toLocaleString()})`:`Confirm Order (${money(grand)})`}
        </button>
      </aside>
    </form>
  </main>;
}

            <input style={{width:"100%",border:"1px solid var(--line)",padding:"9px 12px",borderRadius:"7px",background:"var(--bg)",fontSize:"13px"}} value={cform.subject} onChange={e=>setCform({...cform,subject:e.target.value})} placeholder="Order inquiry / Feedback"/>
          </div>
          <div style={{marginBottom:"14px"}}>
            <label style={{fontSize:"11px",fontWeight:600,display:"block",marginBottom:"4px"}}>Message *</label>
            <textarea required rows={4} style={{width:"100%",border:"1px solid var(--line)",padding:"9px 12px",borderRadius:"7px",background:"var(--bg)",fontSize:"13px",fontFamily:"inherit"}} value={cform.msg} onChange={e=>setCform({...cform,msg:e.target.value})} placeholder="How can we help you today?"></textarea>
          </div>
          <button type="submit" className="primary" style={{width:"100%"}}>Send Message ✉</button>
        </form>
      </div>
    </div>
  </main>
}

function Admin({orders,setOrders,notify}){
  return <main className="container">
    <div className="pageHead"><div><small style={{color:"var(--primary)",fontWeight:700}}>ADMIN</small><h1>Store Dashboard</h1></div></div>
    <div className="formCard">
      <h2>Recent Orders & TrxID Verification</h2>
      {!orders.length?<div className="empty">No orders to verify yet.</div>:orders.map(o=>(
        <div key={o.id} style={{padding:"12px 0",borderBottom:"1px solid var(--line)",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"8px"}}>
          <div>
            <b>{o.id} — {o.paymentMethod}</b>
            <small style={{display:"block",color:"var(--muted)",fontSize:"11px"}}>Date: {o.date} | TrxID: <code>{o.trxId}</code> | Sender: {o.senderNum}</small>
          </div>
          <div><b style={{color:"#e73545"}}>{money(o.total)}</b></div>
        </div>
      ))}
    </div>
  </main>
}

function Newsletter(){
  const [email,setEmail]=useState("");
  return <div className="newsletter">
    <div><span>✉</span><div><h3>Subscribe to Our Newsletter</h3><p>Get instant discounts and updates on new trends.</p></div></div>
    <form onSubmit={e=>{e.preventDefault();alert("Subscribed: "+email);setEmail("")}}>
      <input required type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="Enter email..."/>
      <button>Subscribe</button>
    </form>
  </div>
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
