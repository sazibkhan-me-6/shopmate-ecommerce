<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ShopMate — modern online shopping for electronics, fashion, home, beauty and more." />
    <meta name="theme-color" content="#6046e8" />
    <title>ShopMate — Smart Shopping, Better Living</title>
    <script>
      (function() {
        try {
          var navEntries = performance.getEntriesByType("navigation");
          var isReload = (navEntries.length > 0 && navEntries[0].type === "reload") || (performance && performance.navigation && performance.navigation.type === 1);
          if (isReload && (window.location.pathname !== "/" || window.location.search !== "")) {
            window.location.replace("/");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
